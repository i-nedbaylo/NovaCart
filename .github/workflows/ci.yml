name: CI

on:
  push:
    branches: [main, "feature/**", "fix/**", "codex/**"]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build & Unit/Architecture Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore NovaCart.slnx -p:NuGetAuditMode=all -warnaserror:NU1901,NU1902,NU1903,NU1904

      - name: Build
        run: dotnet build NovaCart.slnx --configuration Release --no-restore

      # Runs everything except tests tagged [Trait("Category", "Integration")] — those need
      # Docker and run in the job below. (Filtering by trait, not by name, so unit tests for
      # the *IntegrationEvent* consumers are not excluded by accident.)
      - name: Unit & architecture tests
        run: >-
          dotnet test NovaCart.slnx
          --configuration Release
          --no-build
          --filter "Category!=Integration"

  integration-tests:
    name: Integration Tests (PostgreSQL, Redis, full order flow)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore NovaCart.slnx

      - name: Build
        run: dotnet build NovaCart.slnx --configuration Release --no-restore

      # Infrastructure/startup failures must fail the job, never silently skip it.
      - name: PostgreSQL and Redis integration tests
        run: >-
          dotnet test tests/IntegrationTests/Catalog.IntegrationTests/NovaCart.Tests.Catalog.IntegrationTests.csproj
          --configuration Release
          --no-build
          --logger trx --results-directory TestResults

      - name: Full order flow
        run: >-
          dotnet test tests/IntegrationTests/OrderFlow.E2E/NovaCart.Tests.OrderFlow.E2E.csproj
          --configuration Release
          --no-build
          --logger trx --results-directory TestResults

      - name: Reject skipped integration tests
        shell: pwsh
        run: |
          $files = @(Get-ChildItem TestResults -Filter *.trx)
          if ($files.Count -eq 0) { throw 'No integration test results found.' }
          foreach ($file in $files) {
            [xml]$trx = Get-Content -LiteralPath $file.FullName
            $counts = $trx.TestRun.ResultSummary.Counters
            if ([int]$counts.total -eq 0 -or [int]$counts.notExecuted -gt 0) {
              throw "Empty or skipped integration tests: $($file.Name)"
            }
          }

      - name: Upload integration results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-results
          path: TestResults
